# Deploy to the cloud.
# Every push to pro builds the images and pushes them to GitHub Container Registry as
# ghcr.io/<owner>/<repo>-<name>:pro (plus a sha tag). Two kinds of image are found:
#   - a folder with a file called Dockerfile: built with that folder as context, named after it
#     (database/ -> aireuskadi-database);
#   - a file called <something>.Dockerfile in a folder of services/: built with the root of the
#     repository as context (the Python services share packages/ and uv.lock, and the gateway
#     compiles web-client), named after the folder (services/api-gateway/gateway.Dockerfile ->
#     aireuskadi-api-gateway).
# Nothing connects to the server: Watchtower on the Oracle VM pulls the new :pro
# images and restarts the containers. With no Dockerfile yet, the run just reports it.
# promote.yml calls this workflow with the commit of a pull request, to publish the images
# before the pull request is merged into pro.
name: Deploy (pro)

on:
  push:
    branches: [pro]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build; the commit that triggered the run when empty
        type: string
        default: ""

concurrency:
  group: deploy-pro
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # The Oracle Always Free VM is an Ampere (Arm) machine.
  # Set the repository variable IMAGE_PLATFORMS to e.g. linux/amd64,linux/arm64 to change it.
  PLATFORMS: ${{ vars.IMAGE_PLATFORMS || 'linux/arm64' }}
  COMMIT: ${{ inputs.ref || github.sha }}

jobs:
  discover:
    # A manual run only counts on the branch pro, which is protected (pull request, CI, promote). Run
    # from another branch, for example dev, which is not protected, it would publish :pro and
    # Watchtower would deploy it without any of that. The other triggers are not affected: a push to
    # pro, and the call of promote.yml (whose event is the one of its own caller).
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/pro'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.find.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - name: Find Dockerfiles
        id: find
        run: |
          alone=$(find . \( -name .git -o -name node_modules \) -prune -o -type f -name Dockerfile -printf '%h\n' \
            | sed 's|^\./||' | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({name: (if . == "." then "app" else (split("/") | last) end), context: ., file: (. + "/Dockerfile")})')
          services=$(find services -mindepth 2 -maxdepth 2 -type f -name '*.Dockerfile' 2>/dev/null | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({name: (split("/") | .[1]), context: ".", file: .})')
          images=$(jq -c -n --argjson a "$alone" --argjson b "$services" '$a + $b')
          echo "images=$images" | tee -a "$GITHUB_OUTPUT"
          if [ "$images" = "[]" ]; then
            echo "::notice::No Dockerfile found yet, nothing to deploy."
          fi

  build-and-push:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    name: Image ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/${{ github.event.repository.name }}-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:pro
            ${{ steps.name.outputs.image }}:sha-${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
