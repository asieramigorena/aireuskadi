# Releases.
# Every push to main (the merge of pro into main) creates the next version tag and a
# GitHub release with notes generated from the merged pull requests.
# The version goes up by patch by default; put #minor or #major in the merge commit
# message, or run the workflow by hand and pick the bump. The first release is v0.1.0.
# If there are Dockerfiles, their images are also published as :vX.Y.Z and :latest.
name: Release (main)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  PLATFORMS: ${{ vars.IMAGE_PLATFORMS || 'linux/arm64' }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      images: ${{ steps.find.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next version
        id: version
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          last=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          bump="${BUMP_INPUT:-patch}"
          case "$MESSAGE" in
            *'#major'*) bump=major ;;
            *'#minor'*) bump=minor ;;
          esac
          if [ -z "$last" ]; then
            last="v0.0.0"
            [ "$bump" = "patch" ] && bump=minor
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          echo "tag=v$major.$minor.$patch" | tee -a "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
      - name: Find Dockerfiles
        id: find
        run: |
          images=$(find . \( -name .git -o -name node_modules \) -prune -o -type f -name Dockerfile -printf '%h\n' \
            | sed 's|^\./||' | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({dir: ., name: (if . == "." then "app" else (split("/") | last) end)})')
          echo "images=$images" | tee -a "$GITHUB_OUTPUT"

  images:
    needs: release
    if: needs.release.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.release.outputs.images) }}
    name: Image ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/${{ github.event.repository.name }}-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.dir }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.release.outputs.tag }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image.dir }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.dir }}
