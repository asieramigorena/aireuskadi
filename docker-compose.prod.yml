# Production stack, for the Oracle VM. It runs the images that deploy-pro.yml publishes in GitHub
# Container Registry (tag :pro), never builds anything, and publishes NO port: nothing can reach
# it from outside. The way in is an optional outbound tunnel that runs next to the gateway and talks
# to http://api-gateway:8000 (the `tunnel` service at the end, only with the profile `tunnel`).
#
# On the VM, in this folder:
#   cp .env.prod.example .env      # only what is not secret. The PASSWORDS are in the OCI Vault: the
#                                  # unit deploy/aireuskadi.service reads them (deploy/fetch-secrets.sh,
#                                  # into memory) and starts the stack; its header says how to install it
#   docker login ghcr.io           # only if the packages of the images are private: with a token that
#                                  # can only read packages. Public packages need no login
#   tunnel/serve.json              # needed only for the tunnel (it comes with the repository; chmod 644 it):
#                                  # set COMPOSE_PROFILES=tunnel in .env to turn it on; the key TS_AUTHKEY
#                                  # is the secret aireuskadi-tailscale-authkey of the Vault
#   docker compose --env-file .env --env-file /run/aireuskadi/secrets.env -f docker-compose.prod.yml up -d
#                                  # what the unit does; by hand, only after fetch-secrets.sh has run
# Watchtower asks every five minutes for a new :pro image of the four application services and
# restarts them. The database is not updated by it: a new image of PostgreSQL can change the format
# of the data, so that one is changed by hand.
# db-init runs at each `docker compose up -d`, not when Watchtower updates a service: after a release that
# changes the schema (a new column, a view that is not replaced by itself), run `docker compose -f
# docker-compose.prod.yml up -d` by hand so that db-init runs again before the new code needs it.
#
# To try it on the laptop with images that were built there, without touching the development
# stack: IMAGE_TAG=<the tag you gave them> docker compose -p other-name -f docker-compose.prod.yml ...

x-logging: &logging
  # Without a limit the log of a container grows until the disk of the VM is full.
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-application: &application
  restart: unless-stopped
  logging: *logging
  labels:
    # Watchtower only updates what has this label.
    com.centurylinklabs.watchtower.enable: "true"

services:
  postgres:
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-database:${IMAGE_TAG:-pro}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?it comes from the Vault (see deploy/fetch-secrets.sh)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Runs once at each start: creates the schema and the read-only role if they are missing, and
  # changes the password of the role if it changed. The services that read wait for it.
  db-init:
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-ingestion-worker:${IMAGE_TAG:-pro}
    entrypoint: ["aireuskadi-db-init"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER:?set it in .env}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?it comes from the Vault (see deploy/fetch-secrets.sh)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  emissions-service:
    <<: *application
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-emissions-service:${IMAGE_TAG:-pro}
    environment:
      # This service only reads: it connects with the read-only role, never with the owner.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_READER_USER}:${POSTGRES_READER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Air quality API. It only reads, like the emissions service, and the gateway reaches it by name.
  air-quality-service:
    <<: *application
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-air-quality-service:${IMAGE_TAG:-pro}
    environment:
      # The read-only role, and the scheme of Node (postgresql://), not the one of SQLAlchemy.
      DATABASE_URL: postgresql://${POSTGRES_READER_USER}:${POSTGRES_READER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health', {signal: AbortSignal.timeout(3000)}).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The only way in: the page and the API. No port is published: the tunnel reaches it by name.
  api-gateway:
    <<: *application
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-api-gateway:${IMAGE_TAG:-pro}
    environment:
      EMISSIONS_URL: http://emissions-service:8000
      AIR_QUALITY_URL: http://air-quality-service:8000
    # It also joins `edge`, the only network the tunnel is on.
    networks: [default, edge]
    depends_on:
      emissions-service:
        condition: service_healthy
      air-quality-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The only writer of the database: it runs the loads when they are due (measurements every hour,
  # the boundaries and the E-PRTR register every month) and remembers nothing but ingestion_run.
  ingestion-scheduler:
    <<: *application
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-ingestion-worker:${IMAGE_TAG:-pro}
    command: ["schedule"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Nobody reads the logs of a run with Grafana here: the container does not wait after it.
      LOG_LINGER_SECONDS: "0"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Updates the four services above when a new :pro image appears. It is the maintained fork:
  # the original containrrr/watchtower was archived in December 2025 and does not work with
  # Docker 29 or later. If the images are private it reads the token of GHCR from the docker login
  # of the VM; with public images it needs none.
  watchtower:
    image: nickfedor/watchtower:latest
    command: ["--interval", "300", "--label-enable", "--cleanup"]
    environment:
      DOCKER_CONFIG: /config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/config:ro
    restart: unless-stopped
    logging: *logging

  # The way in: Tailscale Funnel (issue #11). It opens only an outbound connection, publishes no port
  # and shows ONLY the gateway. It is optional: it starts only with COMPOSE_PROFILES=tunnel in .env,
  # and needs the folder tunnel/ (serve.json) next to this file and TS_AUTHKEY (from the Vault) for the first start. If
  # the same tunnel still runs on the laptop, stop it first: two machines cannot share the name.
  tunnel:
    image: tailscale/tailscale:v1.104.4
    profiles: [tunnel]
    hostname: aireuskadi
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      # The folder, not the file: a missing or replaced single file would break the mount.
      - ./tunnel:/config:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    # Only what the tunnel needs: no extra permissions, a read-only filesystem, and a network of
    # its own shared with the gateway only, so it cannot reach the database or Grafana by name.
    read_only: true
    # /var/run/tailscale: where the CLI of the container looks for the socket (it is a link to /tmp).
    tmpfs:
      - /tmp
      - /var/run/tailscale
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    restart: unless-stopped
    logging: *logging

networks:
  edge:

volumes:
  postgres-data:
  tailscale-state:
