# Production stack, for the Oracle VM. It runs the images that deploy-pro.yml publishes in GitHub
# Container Registry (tag :pro), never builds anything, and publishes NO port: nothing can reach
# it from outside. The way in is an optional outbound tunnel that runs next to the gateway and talks
# to http://api-gateway:8000: Tailscale Funnel (the `tunnel` service, only with the profile `tunnel`)
# or Cloudflare (the `cloudflared` service, only with the profile `cloudflare`). Use one of them.
#
# On the VM, in this folder:
#   cp .env.prod.example .env      # only what is not secret. The PASSWORDS are in the OCI Vault: the
#                                  # unit deploy/aireuskadi.service reads them (deploy/fetch-secrets.sh,
#                                  # into memory) and starts the stack; its header says how to install it
#   sudo docker login ghcr.io      # only if the packages of the images are private (root pulls them): with a token that
#                                  # can only read packages. Public packages need no login
#   tunnel/serve.json              # needed only for the tunnel (it comes with the repository; chmod 644 it):
#                                  # set COMPOSE_PROFILES=tunnel in .env to turn it on; the key TS_AUTHKEY
#                                  # is the secret aireuskadi-tailscale-authkey of the Vault. For Cloudflare:
#                                  # COMPOSE_PROFILES=cloudflare, and the token is the secret
#                                  # aireuskadi-cloudflare-token
#   docker compose --env-file .env --env-file /run/aireuskadi/secrets.env -f docker-compose.prod.yml up -d
#                                  # what the unit does; by hand, only after fetch-secrets.sh has run
# Updates: every five minutes the timer deploy/aireuskadi-update.timer runs deploy/update.sh. When
# the branch pro has a commit that was not deployed, it makes the folder a copy of it, pulls the :pro
# images (not the database), runs `up -d` (only what changed is recreated, and db-init runs first,
# so a new migration is applied before the new code needs it) and recreates the services whose
# mounted files changed. Nothing connects to the VM to deploy. Whoever can merge into pro can run
# anything on the VM this way: pro only takes reviewed pull requests.
#
# To try it on the laptop with images that were built there, without touching the development
# stack: IMAGE_TAG=<the tag you gave them> docker compose -p other-name -f docker-compose.prod.yml ...

x-logging: &logging
  # Without a limit the log of a container grows until the disk of the VM is full.
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-application: &application
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-database:${IMAGE_TAG:-pro}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?it comes from the Vault (see deploy/fetch-secrets.sh)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Runs once at each start: brings the schema up to date and creates the read-only role and the
  # role of the auth service if they are missing (or changes their passwords if they changed). The
  # services that read wait for it.
  db-init:
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-ingestion-worker:${IMAGE_TAG:-pro}
    entrypoint: ["aireuskadi-db-init"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER:?set it in .env}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?it comes from the Vault (see deploy/fetch-secrets.sh)}
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:?set it in .env}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?it comes from the Vault (see deploy/fetch-secrets.sh)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  emissions-service:
    <<: *application
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-emissions-service:${IMAGE_TAG:-pro}
    environment:
      # This service only reads: it connects with the read-only role, never with the owner.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_READER_USER}:${POSTGRES_READER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Air quality API. It only reads, like the emissions service, and the gateway reaches it by name.
  air-quality-service:
    <<: *application
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-air-quality-service:${IMAGE_TAG:-pro}
    environment:
      # The read-only role, and the scheme of Node (postgresql://), not the one of SQLAlchemy.
      DATABASE_URL: postgresql://${POSTGRES_READER_USER}:${POSTGRES_READER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health', {signal: AbortSignal.timeout(3000)}).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The accounts: login with JWT, the admin pages, and /me, which the gateway asks before it opens
  # Grafana. The only service that reads the accounts and the only one that knows JWT_SECRET.
  auth-service:
    <<: *application
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-auth-service:${IMAGE_TAG:-pro}
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg://${POSTGRES_AUTH_USER}:${POSTGRES_AUTH_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?it comes from the Vault (see deploy/fetch-secrets.sh)}
      # Nobody can sign up with the name of the full admin of Grafana: the owner makes that one.
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set it in .env (the account that is the full admin of Grafana)}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The questions to a language model (any API with the chat completions of OpenAI). Each person
  # logs in and types their own key in the panel: it comes with each question and is never kept.
  # No database, no published port; only the gateway reaches it, and it calls the API on the Internet.
  insight-service:
    <<: *application
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-insight-service:${IMAGE_TAG:-pro}
    # Its own network, with the gateway only: no other container can ask it (it checks no session). It is not
    # `internal`, because the model is on the Internet.
    networks: [insight]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The cache of the gateway: the answers of the services for a while, and the texts of the language
  # model for days. No persistence (a restart only loses what is generated again), 64 MB at most,
  # on its own network with the gateway only, no published port.
  redis:
    <<: *application
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [cache]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The only way in: the page and the API. No port is published: the tunnel reaches it by name.
  api-gateway:
    <<: *application
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-api-gateway:${IMAGE_TAG:-pro}
    environment:
      EMISSIONS_URL: http://emissions-service:8000
      AIR_QUALITY_URL: http://air-quality-service:8000
      AUTH_URL: http://auth-service:8000
      GRAFANA_URL: http://grafana:3000
      # Not in depends_on: without it the gateway still answers, and the questions say so.
      INSIGHT_URL: http://insight-service:8000
      REDIS_URL: redis://redis:6379/0
    # It also joins `edge`, the only network the tunnel is on, `cache`, the only one Redis is on,
    # `insight`, the only one the insight service is on, and `monitoring`, the only one Grafana is on.
    networks: [default, edge, cache, insight, monitoring]
    depends_on:
      # Started, not healthy: without Redis the gateway still answers.
      redis:
        condition: service_started
      emissions-service:
        condition: service_healthy
      air-quality-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The only writer of the database: it runs the loads when they are due (measurements every hour,
  # the boundaries and the E-PRTR register every month) and remembers nothing but ingestion_run.
  ingestion-scheduler:
    <<: *application
    image: ghcr.io/${GHCR_OWNER:-asieramigorena}/aireuskadi-ingestion-worker:${IMAGE_TAG:-pro}
    command: ["schedule"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Nobody reads the logs of a run with Grafana here: the container does not wait after it.
      LOG_LINGER_SECONDS: "0"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # The way in: Tailscale Funnel (issue #11). It opens only an outbound connection, publishes no port
  # and shows ONLY the gateway. It is optional: it starts only with COMPOSE_PROFILES=tunnel in .env,
  # and needs the folder tunnel/ (serve.json) next to this file and TS_AUTHKEY (from the Vault) for the first start. If
  # the same tunnel still runs on the laptop, stop it first: two machines cannot share the name.
  tunnel:
    # By its digest too: the timer pulls the images again, and a tag can be published again.
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    profiles: [tunnel]
    hostname: aireuskadi
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      # The folder, not the file: a missing or replaced single file would break the mount.
      - ./tunnel:/config:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    # Only what the tunnel needs: no extra permissions, a read-only filesystem, and a network of
    # its own shared with the gateway only, so it cannot reach the database or Grafana by name.
    read_only: true
    # /var/run/tailscale: where the CLI of the container looks for the socket (it is a link to /tmp).
    tmpfs:
      - /tmp
      - /var/run/tailscale
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    restart: unless-stopped
    logging: *logging

  # The other way in: a tunnel of Cloudflare, for a domain of our own. Like the one of Tailscale it
  # opens only an outbound connection and publishes no port. It starts only with
  # COMPOSE_PROFILES=cloudflare in .env. The route (the domain -> http://api-gateway:8000) is set in
  # the panel of Cloudflare; the token of the tunnel is the secret aireuskadi-cloudflare-token of the
  # Vault (fetch-secrets.sh), and cloudflared reads it from TUNNEL_TOKEN, never from the command line.
  # Turn the profile on only once that secret exists: without the token cloudflared stops at once and
  # starts again and again.
  cloudflared:
    # By its digest: this container holds the token, and the timer pulls the images again.
    image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
    profiles: [cloudflare]
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      # Its metrics only inside the container: by default they listen on every address, and the
      # gateway, on the same network, could read them.
      TUNNEL_METRICS: 127.0.0.1:20241
    depends_on:
      api-gateway:
        condition: service_healthy
    # The same as the tunnel of Tailscale: nothing written, no extra permissions, and only the
    # network `edge`, so it can reach the gateway and nothing else.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    restart: unless-stopped
    logging: *logging

  # Centralised logs and metrics. Alloy reads the logs of every container and sends them to Loki,
  # and the metrics (state, CPU, memory...) to Prometheus; Grafana shows both. They are on the
  # network `monitoring` only, which the gateway shares with them and nothing else does: Grafana
  # trusts the user that the gateway names (auth proxy), so nothing else may reach it.
  # The same as in docker-compose.yml. The images are pinned: a new version comes only when this
  # file names it.
  loki:
    image: grafana/loki:3.5.7
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [monitoring]
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
    restart: unless-stopped
    logging: *logging

  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read access to the logs of the other containers. The Docker socket gives full control of
      # Docker even when mounted read-only, so no other service gets it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      # The cAdvisor inside Alloy reads the cgroups and the data of Docker (read only) to get the
      # CPU, the memory and the network of each container.
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      # The full admin of Grafana is the account of the site with this name.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set it in .env (the account that is the full admin of Grafana)}
      # Never used to log in (the form and basic auth are off), but Grafana needs one for the admin
      # it creates.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # It lives at /grafana/ of the site, behind the gateway.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Auth proxy: no login of its own; it trusts the name that the gateway puts in X-WEBAUTH-USER
      # and makes the user the first time.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Nor a user and password on its API: the only way in is the gateway.
      GF_AUTH_BASIC_ENABLED: "false"
      # Every admin of the site sees the dashboards and can search with Explore.
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      # No WebSockets: the gateway passes on plain HTTP only.
      GF_LIVE_MAX_CONNECTIONS: "0"
      # Grafana does not call grafana.com: no check for updates, no plugin preinstall and no usage
      # report. When the network cannot resolve names (the Wi-Fi of the owner) those calls only fail
      # and fill the error panels.
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Nor does the browser: the home page is the Health dashboard, not the one of Grafana with
      # the news of grafana.com.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/health.json
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana-alerts.yml:/etc/grafana/provisioning/alerting/alerts.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # No published port: only the gateway reaches it.
    networks: [monitoring]
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped
    logging: *logging

networks:
  edge:
  cache:
  insight:
  monitoring:

volumes:
  postgres-data:
  loki-data:
  prometheus-data:
  alloy-data:
  grafana-data:
  tailscale-state:
