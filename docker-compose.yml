# Local development stack: PostgreSQL + PostGIS and Redis.
# Copy .env.example to .env before running `docker compose up -d`.
# The application services are added here as they get their Dockerfile.
# Centralised logs (Loki, Alloy, Grafana) only start with the profile `logging`:
#   docker compose --profile logging up -d
# The ingestion worker runs on demand, not with `up`:
#   docker compose run --rm ingestion-worker boundaries
#   docker compose run --rm ingestion-worker eprtr --year 2023
services:
  postgres:
    build: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Published on localhost only, so the host can run the worker and the tests.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Ingestion worker. Inside a container its logs reach Loki (see the logging profile).
  # Load the boundaries before the E-PRTR register.
  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion-worker/worker.Dockerfile
    profiles: [worker]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Seconds the container stays up after a run so that Alloy reads its logs (see
      # entrypoint.sh). Only useful with the logging profile; use 0 to not wait.
      LOG_LINGER_SECONDS: ${LOG_LINGER_SECONDS:-20}
    depends_on:
      postgres:
        condition: service_healthy

  # Centralised logs. Alloy reads the logs of every container and sends them to Loki;
  # Grafana searches them. Grafana is published on localhost only.
  # The Grafana stack (this block and observability/) was set up assisted by Claude.
  loki:
    image: grafana/loki:3.5.7
    profiles: [logging]
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.0
    profiles: [logging]
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read access to the logs of the other containers. The Docker socket gives full control of
      # Docker even when mounted read-only, so no other service gets it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    profiles: [logging]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres-data:
  loki-data:
  alloy-data:
  grafana-data:
  