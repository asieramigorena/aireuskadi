# Local development stack: PostgreSQL + PostGIS, Redis (the cache of the gateway) and the services.
# Copy .env.example to .env, then `docker compose --profile worker up -d --build` starts everything,
# the loads of the data too (without `--profile worker`, everything but the loads).
# Loki, Alloy, Prometheus and Grafana start with the rest: the logs and the state of every service
# are in Grafana, at http://127.0.0.1:8080/admin with an admin account (dashboards "Health",
# "Ingestion", "Services" and "API"). Accounts:
#   docker compose run --rm --entrypoint aireuskadi-admin db-init add <name>   (then `promote`)
# The scheduler (profile worker) runs the loads when they are due; one load by hand:
#   docker compose run --rm ingestion-worker boundaries
#   docker compose run --rm ingestion-worker eprtr --year 2023
# The image of the ingestion worker and the settings that its services share.
# Docker orchestrated by Claude
x-ingestion-worker: &ingestion-worker
  build:
    context: .
    dockerfile: services/ingestion-worker/worker.Dockerfile
  profiles: [worker]
  environment: &ingestion-environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    build: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Published on localhost only, so the host can run the worker and the tests.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Makes the schema (the Alembic migrations) and the roles of the services, and stops. The
  # services wait for it, so a fresh database is ready before they connect. It runs at every `up`:
  # with nothing to do it changes nothing.
  db-init:
    build:
      context: .
      dockerfile: services/ingestion-worker/worker.Dockerfile
    entrypoint: ["aireuskadi-db-init"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD}
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The logouts of the auth service (auth_service/logouts.py), apart from the cache: the auth
  # service cannot touch what everybody is served, and a full cache cannot push a logout out. Full,
  # it refuses a new logout instead (the auth service then keeps it in memory). No disk: a restart
  # forgets the logouts of the last 8 hours. Its own network, with the auth service only.
  # Security fix by Claude (audit 2026-11-26).
  logouts:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "16mb", "--maxmemory-policy", "noeviction"]
    networks: [logouts]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The cache of the gateway (services/api-gateway/src/api_gateway/cache.py). Nothing in it must
  # survive: no disk, and a ceiling of memory past which the oldest answers are dropped, so that
  # questions with made-up values cannot fill the machine.
  redis:
    # Pinned by digest: the timer pulls the images again. Security fix by Claude (audit 2026-11-26).
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    # Only the gateway reaches it, and it publishes no port: what is in it is served to the browser.
    networks: [cache]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Emissions API. It publishes no port: only the gateway will reach it, through the internal
  # network of the compose, as http://emissions-service:8000.
  emissions-service:
    build:
      context: .
      dockerfile: services/emissions-service/emissions.Dockerfile
    environment:
      # Same database, other user: this service only reads, so it connects with the read-only role
      # (created by aireuskadi-db-init), never with the owner. The password of the owner does not
      # reach this container.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_READER_USER}:${POSTGRES_READER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      db-init:
        condition: service_completed_successfully
    # /health asks the database. The image has no curl, so Python makes the request; a 503 raises
    # in urlopen and the command fails.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # The accounts: login with JWT, the admin pages, and /me, which the gateway asks before it opens
  # Grafana. It is the only service that reads the accounts (with a role of its own) and the only
  # one that knows JWT_SECRET. It publishes no port: the gateway passes /admin/... on to it.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/auth.Dockerfile
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg://${POSTGRES_AUTH_USER}:${POSTGRES_AUTH_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      # Nobody can sign up with the name of the full admin of Grafana: the owner makes that one.
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # The logouts, kept across a restart (auth_service/logouts.py).
      # Security fix by Claude (audit 2026-11-26).
      REDIS_URL: redis://logouts:6379/0
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    # `logouts` for its own Redis. Security fix by Claude (audit 2026-11-26).
    networks: [default, logouts]

  # The questions to a language model (any API with the chat completions of OpenAI). Each person
  # logs in and types their own key in the panel: it comes with each question and is never kept.
  # No database, no published port; only the gateway reaches it, and it calls the API on the Internet.
  insight-service:
    build:
      context: .
      dockerfile: services/insight-service/insight.Dockerfile
    # Its own network, with the gateway only: no other container can ask it (it checks no session). It is not
    # `internal`, because the model is on the Internet.
    networks: [insight]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Air quality API (stations, latest values, series, exposure). Like the emissions service it only
  # reads, publishes no port and is reached by the other containers as http://air-quality-service:8000.
  air-quality-service:
    build:
      context: .
      dockerfile: services/air-quality-service/air-quality.Dockerfile
    environment:
      # The read-only role, and the scheme of Node (postgresql://), not the one of SQLAlchemy.
      DATABASE_URL: postgresql://${POSTGRES_READER_USER}:${POSTGRES_READER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      db-init:
        condition: service_completed_successfully
    # /health asks the database. The image has no curl: Node makes the request, and a 503 or an
    # error ends with a non-zero exit code.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health', {signal: AbortSignal.timeout(3000)}).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # The only way in for the browser: it asks the emissions service and the air quality service for
  # an explicit list of routes, and the services themselves are never published. The port is only
  # open on this machine.
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/gateway.Dockerfile
    environment:
      EMISSIONS_URL: http://emissions-service:8000
      AIR_QUALITY_URL: http://air-quality-service:8000
      AUTH_URL: http://auth-service:8000
      GRAFANA_URL: http://grafana:3000
      # Not in depends_on: without it the gateway still answers, and the questions say so.
      INSIGHT_URL: http://insight-service:8000
      # Without it the gateway asks the services every time, as before.
      REDIS_URL: redis://redis:6379/0
      # X-Forwarded-For is believed only from the network of the tunnels.
      # Security fix by Claude (audit 2026-11-26).
      TUNNEL_NETWORK: 10.89.1.0/24
      # /docs and /openapi.json, the whole API in one page: only here, never on the VM (the page
      # loads its scripts from a CDN, and the list of routes is the list of what can be probed).
      DOCS_ENABLED: "true"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8000"
    # It also joins `edge`, the only network the tunnel is on, `cache`, the only one Redis is on,
    # `insight`, the only one the insight service is on, and `monitoring`, the only one Grafana is on.
    # A fixed address on `monitoring`: the only one that Grafana believes.
    # Security fix by Claude (audit 2026-11-26).
    networks:
      default:
      edge:
      cache:
      insight:
      monitoring:
        ipv4_address: 10.89.2.10
    depends_on:
      emissions-service:
        condition: service_healthy
      air-quality-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      # Started, not healthy: without Redis the gateway still answers.
      redis:
        condition: service_started
    # The check of the gateway itself: it does not ask any service. The image has no curl.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # The way in from the internet while the VM does not exist: Tailscale Funnel, from a container.
  # It only starts on request (`docker compose --profile tunnel up -d tunnel`), opens only an
  # outbound connection, publishes no port, and shows ONLY the gateway at
  # https://aireuskadi.<your tailnet>.ts.net (see tunnel/serve.json). Stop it and nothing is exposed.
  # TS_AUTHKEY is only read the first time: afterwards the identity is in the tailscale-state volume.
  # The name is shared with the VM: stop one tunnel before starting the other.
  tunnel:
    # Pinned by digest: the timer pulls the images again. Security fix by Claude (audit 2026-11-26).
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    profiles: [tunnel]
    hostname: aireuskadi
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      # The folder, not the file: a missing or replaced single file would break the mount.
      - ./tunnel:/config:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    # Only what the tunnel needs: no extra permissions, a read-only filesystem, and a network of
    # its own shared with the gateway only, so it cannot reach the database or Grafana by name.
    read_only: true
    # /var/run/tailscale: where the CLI of the container looks for the socket (it is a link to /tmp).
    tmpfs:
      - /tmp
      - /var/run/tailscale
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    restart: unless-stopped

  # Ingestion worker, for one load by hand: `docker compose run --rm ingestion-worker <load>`.
  # Load the boundaries before the E-PRTR register. Its own profile, so that `--profile worker`
  # does not start it without a load to run.
  ingestion-worker:
    <<: *ingestion-worker
    profiles: [manual]
    environment:
      <<: *ingestion-environment
      # Seconds the container stays up after a run so that Alloy reads its logs (see
      # entrypoint.sh). Only useful with the logging profile; use 0 to not wait.
      LOG_LINGER_SECONDS: ${LOG_LINGER_SECONDS:-20}

  # The same image, kept up: it runs the loads when they are due (measurements every hour, the
  # boundaries, the E-PRTR register and the inventory every month) and remembers nothing but
  # ingestion_run, so a restart loses nothing. On its first start it loads them all.
  ingestion-scheduler:
    <<: *ingestion-worker
    command: ["schedule"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Centralised logs and metrics. Alloy reads the logs of every container and sends them to Loki,
  # and the metrics (state, CPU, memory...) to Prometheus; Grafana shows both. They are on the
  # network `monitoring` only, which the gateway shares with them and nothing else does: Grafana
  # trusts the user that the gateway names (auth proxy), and only from the fixed address of the
  # gateway (GF_AUTH_PROXY_WHITELIST).
  # The Grafana stack (this block and observability/) was set up assisted by Claude.
  loki:
    # Pinned by digest: the timer pulls the images again. Security fix by Claude (audit 2026-11-26).
    image: grafana/loki:3.5.7@sha256:0eaee7bf39cc83aaef46914fb58f287d4f4c4be6ec96b86c2ed55719a75e49c8
    # Cannot answer for another address on the network (ARP).
    # Security fix by Claude (audit 2026-11-26).
    cap_drop: [NET_RAW]
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [monitoring]
    restart: unless-stopped

  prometheus:
    # Pinned by digest: the timer pulls the images again. Security fix by Claude (audit 2026-11-26).
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    # Cannot answer for another address on the network (ARP).
    # Security fix by Claude (audit 2026-11-26).
    cap_drop: [NET_RAW]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
    restart: unless-stopped

  alloy:
    # Pinned by digest: the timer pulls the images again. Security fix by Claude (audit 2026-11-26).
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read access to the logs of the other containers. The Docker socket gives full control of
      # Docker even when mounted read-only, so no other service gets it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      # The cAdvisor inside Alloy reads the cgroups and the data of Docker (read only) to get the
      # CPU, the memory and the network of each container.
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  grafana:
    # 12.4, by digest: 12.0 has known CVEs (CVE-2025-4123, -6023, -6197) and no more fixes.
    # Security fix by Claude (audit 2026-11-26).
    image: grafana/grafana:12.4.16@sha256:982fa6bf18cc38280a30bf08c3b673486067d4805b25a9d4756688a689a993c7
    # Cannot answer for another address on the network (ARP).
    # Security fix by Claude (audit 2026-11-26).
    cap_drop: [NET_RAW]
    environment:
      # The full admin of Grafana is the account of the site with this name.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Never used to log in (the form and basic auth are off), but Grafana needs one for the admin
      # it creates.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # It lives at /grafana/ of the site, behind the gateway.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Auth proxy: no login of its own; it trusts the name that the gateway puts in X-WEBAUTH-USER
      # and makes the user the first time.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      # The user is believed only from the gateway: Loki, Prometheus and Alloy are on the same
      # network and could name any user. Security fix by Claude (audit 2026-11-26).
      GF_AUTH_PROXY_WHITELIST: 10.89.2.10
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Nor a user and password on its API: the only way in is the gateway.
      GF_AUTH_BASIC_ENABLED: "false"
      # Every admin of the site sees the dashboards and can search with Explore.
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      # No WebSockets: the gateway passes on plain HTTP only.
      GF_LIVE_MAX_CONNECTIONS: "0"
      # Grafana does not call grafana.com: no check for updates, no plugin preinstall and no usage
      # report. When the network cannot resolve names (the Wi-Fi of the owner) those calls only fail
      # and fill the error panels.
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Nor does the browser: the home page is the Health dashboard, not the one of Grafana with
      # the news of grafana.com.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/health.json
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana-alerts.yml:/etc/grafana/provisioning/alerting/alerts.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # No published port: only the gateway reaches it.
    networks: [monitoring]
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

# Fixed subnets: the gateway believes X-Forwarded-For only from `edge` (TUNNEL_NETWORK) and Grafana
# only the gateway's address on `monitoring`. Security fix by Claude (audit 2026-11-26).
networks:
  edge:
    ipam:
      config:
        - subnet: 10.89.1.0/24
  cache:
  logouts:
  insight:
  monitoring:
    ipam:
      config:
        - subnet: 10.89.2.0/24
          # The others get their addresses from the upper half only: never the gateway's .10.
          # Security fix by Claude (audit 2026-11-26).
          ip_range: 10.89.2.128/25

volumes:
  postgres-data:
  loki-data:
  prometheus-data:
  alloy-data:
  grafana-data:
  tailscale-state:
  