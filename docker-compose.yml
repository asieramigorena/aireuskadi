# Local development stack: PostgreSQL + PostGIS and Redis.
# Copy .env.example to .env before running `docker compose up -d`.
# The application services are added here as they get their Dockerfile.
# Loki, Alloy, Prometheus and Grafana start with the rest: the logs and the state of every service
# are in Grafana (http://127.0.0.1:3000, dashboards "Health", "Ingestion", "Services" and "API").
# The ingestion worker runs on demand, not with `up`:
#   docker compose run --rm ingestion-worker boundaries
#   docker compose run --rm ingestion-worker eprtr --year 2023
# The image of the ingestion worker and the settings that its services share.
x-ingestion-worker: &ingestion-worker
  build:
    context: .
    dockerfile: services/ingestion-worker/worker.Dockerfile
  profiles: [worker]
  environment: &ingestion-environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    build: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Published on localhost only, so the host can run the worker and the tests.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Emissions API. It publishes no port: only the gateway will reach it, through the internal
  # network of the compose, as http://emissions-service:8000.
  emissions-service:
    build:
      context: .
      dockerfile: services/emissions-service/emissions.Dockerfile
    environment:
      # Same database, other user: this service only reads, so it connects with the read-only role
      # (created by aireuskadi-db-init), never with the owner. The password of the owner does not
      # reach this container.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_READER_USER}:${POSTGRES_READER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # /health asks the database. The image has no curl, so Python makes the request; a 503 raises
    # in urlopen and the command fails.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # The only way in for the browser: it asks the emissions service for an explicit list of routes
  # and the service itself is never published. The port is only open on this machine.
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/gateway.Dockerfile
    environment:
      EMISSIONS_URL: http://emissions-service:8000
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8000"
    # It also joins `edge`, the only network the tunnel is on.
    networks: [default, edge]
    depends_on:
      emissions-service:
        condition: service_healthy
    # The check of the gateway itself: it does not ask the emissions service. The image has no curl.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # The way in from the internet while the VM does not exist: Tailscale Funnel, from a container.
  # It only starts on request (`docker compose --profile tunnel up -d tunnel`), opens only an
  # outbound connection, publishes no port, and shows ONLY the gateway at
  # https://aireuskadi.<your tailnet>.ts.net (see tunnel/serve.json). Stop it and nothing is exposed.
  # TS_AUTHKEY is only read the first time: afterwards the identity is in the tailscale-state volume.
  # The name is shared with the VM: stop one tunnel before starting the other.
  tunnel:
    image: tailscale/tailscale:v1.104.4
    profiles: [tunnel]
    hostname: aireuskadi
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      # The folder, not the file: a missing or replaced single file would break the mount.
      - ./tunnel:/config:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    # Only what the tunnel needs: no extra permissions, a read-only filesystem, and a network of
    # its own shared with the gateway only, so it cannot reach the database or Grafana by name.
    read_only: true
    # /var/run/tailscale: where the CLI of the container looks for the socket (it is a link to /tmp).
    tmpfs:
      - /tmp
      - /var/run/tailscale
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    restart: unless-stopped

  # Ingestion worker. Inside a container its logs reach Loki (see the logging profile).
  # Load the boundaries before the E-PRTR register.
  ingestion-worker:
    <<: *ingestion-worker
    environment:
      <<: *ingestion-environment
      # Seconds the container stays up after a run so that Alloy reads its logs (see
      # entrypoint.sh). Only useful with the logging profile; use 0 to not wait.
      LOG_LINGER_SECONDS: ${LOG_LINGER_SECONDS:-20}

  # The same image, kept up: it runs the loads when they are due (measurements every hour, the
  # boundaries and the E-PRTR register every month) and remembers nothing but ingestion_run, so
  # a restart loses nothing. Start it with: docker compose --profile worker up -d ingestion-scheduler
  ingestion-scheduler:
    <<: *ingestion-worker
    command: ["schedule"]
    restart: unless-stopped

  # Centralised logs and metrics. Alloy reads the logs of every container and sends them to Loki,
  # and the metrics (state, CPU, memory...) to Prometheus; Grafana shows both. Grafana is
  # published on localhost only.
  # The Grafana stack (this block and observability/) was set up assisted by Claude.
  loki:
    image: grafana/loki:3.5.7
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read access to the logs of the other containers. The Docker socket gives full control of
      # Docker even when mounted read-only, so no other service gets it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      # The cAdvisor inside Alloy reads the cgroups and the data of Docker (read only) to get the
      # CPU, the memory and the network of each container.
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana does not call grafana.com: no check for updates, no plugin preinstall and no usage
      # report. When the network cannot resolve names (the Wi-Fi of the owner) those calls only fail
      # and fill the error panels.
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

networks:
  edge:

volumes:
  postgres-data:
  loki-data:
  prometheus-data:
  alloy-data:
  grafana-data:
  tailscale-state:
  