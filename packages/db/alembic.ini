# Alembic for the core schema. The migrations live in the package (aireuskadi_db/migrations), so
# that they travel in the images; aireuskadi-db-init applies them. To write a new one after a
# change of the models, from the root of the repository:
#   uv run --env-file .env alembic -c packages/db/alembic.ini revision --autogenerate -m "what changed"
# and read what it wrote before committing it: autogenerate does not see everything (a view, a
# renamed column).
[alembic]
script_location = aireuskadi_db:migrations
file_template = %%(rev)s_%%(slug)s
