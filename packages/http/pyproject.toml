[project]
name = "aireuskadi-http"
version = "0.1.0"
description = "AirEuskadi HTTP pieces shared by the FastAPI services: errors as problem documents and the request log"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
