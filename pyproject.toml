# uv workspace root. It is not a package itself: each member below is one service
# (or the shared data model) with its own pyproject.toml.
[project]
name = "aireuskadi"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]
# Node.js service, not a Python package.
exclude = ["services/air-quality-service"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
target-version = "py312"
line-length = 100
