[project]
name = "api-gateway"
version = "0.1.0"
description = "AirEuskadi API Gateway: single entry point that composes the services"
requires-python = ">=3.12"
dependencies = [
    "aireuskadi-http",
    "aireuskadi-logger",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5",
]

[tool.uv.sources]
aireuskadi-http = { workspace = true }
aireuskadi-logger = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
