[project]
name = "api-gateway"
version = "0.1.0"
description = "AirEuskadi API Gateway: single entry point that composes the services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
