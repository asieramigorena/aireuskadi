[project]
name = "auth-service"
version = "0.1.0"
description = "AirEuskadi accounts: login with JWT and the admin pages"
requires-python = ">=3.12"
dependencies = [
    "aireuskadi-db",
    "aireuskadi-http",
    "aireuskadi-logger",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "redis>=5",
]

[tool.uv.sources]
aireuskadi-db = { workspace = true }
aireuskadi-http = { workspace = true }
aireuskadi-logger = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
