[project]
name = "ingestion-worker"
version = "0.1.0"
description = "AirEuskadi ingestion worker: loads the open data sources into the database"
requires-python = ">=3.12"
dependencies = [
    "aireuskadi-db",
    "httpx>=0.27",
]

[tool.uv.sources]
aireuskadi-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
