<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AirEuskadi</title>
    <!-- The emoji of the wind as the icon of the tab: an SVG in the page, so no file and no request. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌬️</text></svg>" />
  </head>
  <body>
    <main id="app">
      <div id="map" role="img" aria-label="3D map of the declared industrial emissions of the Basque Country"></div>

      <header class="caption">
        <div class="brand">
          <h1>AirEuskadi</h1>
          <nav id="languages" class="languages" aria-label="Language"></nav>
          <a id="login-link" class="login-link" href="/user">Log in</a>
        </div>
        <nav id="controls" class="controls" aria-label="Choose the map"></nav>
        <p id="caption"></p>
        <p id="status" role="status"></p>
      </header>

      <aside id="panel" aria-label="Details of the unit" hidden></aside>

      <!-- The questions to a language model, in a corner, always there (src/ask.ts). -->
      <section id="ask" class="ask-box"></section>

      <section id="legend" class="legend" aria-label="Colour of the units"></section>

      <footer class="credits">
        <p id="emissions-credit">Emissions: E-PRTR register, Open Data Euskadi, CC BY 4.0.</p>
        <p id="air-credit"></p>
        <p id="attribution"></p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
