<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AirEuskadi</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="app">
      <div id="map" role="img" aria-label="3D map of the declared industrial emissions of the Basque Country"></div>

      <header class="caption">
        <div class="brand">
          <h1>AirEuskadi</h1>
          <nav id="languages" class="languages" aria-label="Language"></nav>
        </div>
        <nav id="controls" class="controls" aria-label="Choose the map"></nav>
        <p id="caption"></p>
        <p id="status" role="status"></p>
      </header>

      <aside id="panel" aria-label="Details of the unit" hidden></aside>

      <section id="legend" class="legend" aria-label="Colour of the units"></section>

      <footer class="credits">
        <p id="emissions-credit">Emissions: E-PRTR register, Open Data Euskadi, CC BY 4.0.</p>
        <p id="air-credit"></p>
        <p id="attribution"></p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
